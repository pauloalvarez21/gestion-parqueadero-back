# ============ PERFIL PRO (PostgreSQL) ============
# Puerto para Producción
server.port=8080

# Database Configuration (valores por defecto para docker-compose, sobreescribir con variables de entorno)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/parqueaderodb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# En produccion usamos 'validate' para no modificar el esquema automáticamente.
# Usar Flyway o Liquibase para migraciones.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# JWT Configuration (OBLIGATORIO: configurar via variable de entorno)
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Admin User Configuration (OBLIGATORIO: configurar via variable de entorno)
admin.user.username=${ADMIN_USERNAME:admin}
admin.user.password=${ADMIN_PASSWORD}

# Configuración de cupos iniciales (Valores para Producción)
parqueadero.cupos.carro=50
parqueadero.cupos.moto=50
parqueadero.cupos.bicicleta=20
parqueadero.cupos.camion=10

# CORS - Origen permitido del frontend (configurar con el dominio real)
cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200}

# Deshabilitar Swagger/OpenAPI en producción
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Logging - nivel INFO en producción
logging.level.com.parqueadero=INFO